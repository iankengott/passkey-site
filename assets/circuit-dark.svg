d3" stroke="none">1G</text><g transform="translate(576,896) rotate(90)"><path d="M16 88L16 96"/><path d="M0 80L16 88"/><path d="M32 64L0 80"/><path d="M0 48L32 64"/><path d="M32 32L0 48"/><path d="M16 16L16 24"/><path d="M16 24L32 32"/></g><text x="486" y="954" font-size="17" fill="#e9e3d3" stroke="none">Rdm</text><text x="486" y="977" font-size="14" fill="#e9e3d3" stroke="none">27</text><g transform="translate(704,928) rotate(0)"><path d="M16 88L16 96"/><path d="M0 80L16 88"/><path d="M32 64L0 80"/><path d="M0 48L32 64"/><path d="M32 32L0 48"/><path d="M16 16L16 24"/><path d="M16 24L32 32"/></g><text x="742" y="953" font-size="17" fill="#e9e3d3" stroke="none">Rref_dm</text><text x="742" y="976" font-size="14" fill="#e9e3d3" stroke="none">1G</text><text x="45" y="465" font-size="23" fill="#e9e3d3" stroke="none">Power path: ideal behavioral parts and assumed loads.</text><text x="45" y="497" font-size="18" fill="#e9e3d3" stroke="none">All component equations and pulse timings are retained in the linked netlist.</text><text x="45" y="580" font-size="23" fill="#e9e3d3" stroke="none">Passive USB network</text><text x="45" y="614" font-size="18" fill="#e9e3d3" stroke="none">Rpu_internal is inside the MCU.</text><text x="45" y="648" font-size="18" fill="#e9e3d3" stroke="none">1.398k is a documented limit,</text><text x="45" y="682" font-size="18" fill="#e9e3d3" stroke="none">not its nominal resistance.</text><text x="45" y="716" font-size="18" fill="#e9e3d3" stroke="none">The 1G references are numerical</text><text x="45" y="750" font-size="18" fill="#e9e3d3" stroke="none">aids, not board components.</text><text x="960" y="580" font-size="21" fill="#e9e3d3" stroke="none">MODEL SCOPE</text><text x="960" y="615" font-size="18" fill="#e9e3d3" stroke="none">RP2354A, 2 MB stacked flash, proposed. No complete MCU schematic.</text><text x="960" y="650" font-size="18" fill="#e9e3d3" stroke="none">The supply is an ideal behavioral LDO, not a selected regulator.</text><text x="960" y="685" font-size="18" fill="#e9e3d3" stroke="none">MCU load proxy: idle 7.585 mA, active 29.5 mA.</text><text x="960" y="720" font-size="18" fill="#e9e3d3" stroke="none">LED load proxy: 0.5 mA active. Assumptions, not measurements.</text><text x="960" y="755" font-size="18" fill="#e9e3d3" stroke="none">No firmware, USB protocol, crystal or core switching simulation.</text><text x="960" y="790" font-size="18" fill="#e9e3d3" stroke="none"></text><text x="960" y="825" font-size="21" fill="#e9e3d3" stroke="none">SERVICE ANNOTATION · NOT SIMULATED</text><text x="960" y="860" font-size="18" fill="#e9e3d3" stroke="none">QSPI_SS → 1 kohm → TP_BOOT. TP_GND → ground.</text><text x="960" y="895" font-size="18" fill="#e9e3d3" stroke="none">Recessed contacts are proposed for boot recovery. No user button.</text><text x="960" y="930" font-size="18" fill="#e9e3d3" stroke="none"></text><text x="960" y="965" font-size="18" fill="#e9e3d3" stroke="none">No board layout, tested fit, manufacturing or compliance claim.</text></g><text x="48" y="1260" font-size="18" fill="#e9e3d3" stroke="none">Exported 22 source wire segments, 23 net flags and 22 source symbols. Full formulas are in the ASC and CIR files.</text><text x="48" y="1293" font-size="18" fill="#e9e3d3" stroke="none">No hardware has been built. Source connectivity was checked previously. This rendering adds no new electrical test.</text></g></svg>